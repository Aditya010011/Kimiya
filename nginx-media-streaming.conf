# Nginx configuration optimized for media streaming
# This configuration includes optimizations for:
# - Real-time audio streaming (WebRTC, WebSocket)
# - HTTP Live Streaming (HLS)
# - Progressive download
# - Low-latency streaming

# Main nginx configuration additions
# Add these to your main nginx.conf in the http block

# Buffer sizes for media streaming
proxy_buffering off;
proxy_cache off;
proxy_request_buffering off;

# Connection settings for streaming
upstream backend {
    server localhost:3001;
    keepalive 32;
}

# Rate limiting for API endpoints (protect against abuse)
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=media:10m rate=5r/s;

# Map for WebSocket upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen 8080;
    server_name 20.255.99.49 kimiya-ai.ddns.net;
    
    # Media streaming optimizations
    client_max_body_size 100M;
    client_body_buffer_size 1M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    
    # Enable sendfile for efficient file transfers
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    
    # Keep-alive connections
    keepalive_timeout 65;
    keepalive_requests 100;
    
    # Frontend - serve static files
    location / {
        root /var/www/kimiya-voice/dist;
        try_files $uri $uri/ /index.html;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # Audio and video files with streaming support
        location ~* \.(mp3|mp4|wav|ogg|webm|m4a|aac|flac)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            add_header Accept-Ranges bytes;
            
            # Enable MP4 streaming module if available
            location ~* \.(mp4|webm)$ {
                # mp4; # Uncomment if nginx-mp4 module is installed
                add_header Cache-Control "public, max-age=604800";
            }
        }
    }
    
    # Backend API with rate limiting
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts for API requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # WebSocket for real-time audio streaming
    location /api/conversationrelay-ws {
        # No rate limiting for WebSocket connections
        
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Critical for real-time streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        
        # WebSocket timeouts for persistent connections
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
        
        # Buffer configuration for audio data
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;
    }
    
    # Media streaming endpoints
    location /api/media/ {
        limit_req zone=media burst=10 nodelay;
        
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Media streaming optimizations
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        
        # Large file support
        client_max_body_size 50M;
        proxy_max_temp_file_size 0;
        
        # Extended timeouts for media processing
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    
    # Health check endpoints
    location /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /ping {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Gzip compression (avoid for audio/video)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # Disable gzip for media files
    location ~* \.(mp3|mp4|wav|ogg|webm|m4a|aac|flac|avi|mov)$ {
        gzip off;
    }
}
