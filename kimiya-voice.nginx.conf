server {
    listen 80;
    listen 8080;
    server_name 20.255.99.49 kimiya-ai.ddns.net;

    # Media streaming optimizations
    client_max_body_size 100M;
    client_body_buffer_size 1M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # Enable sendfile for efficient file transfers
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Keep-alive connections for better performance
    keepalive_timeout 65;
    keepalive_requests 100;
    
    # Frontend - serve static files
    location / {
        root /var/www/kimiya-voice/dist;
        try_files $uri $uri/ /index.html;
        
        # Add security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Audio and video files with streaming support
        location ~* \.(mp3|mp4|wav|ogg|webm|m4a|aac|flac)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            add_header Accept-Ranges bytes;

            # Enable range requests for audio/video streaming
            location ~* \.(mp4|webm|ogg)$ {
                mp4;
                add_header Cache-Control "public, max-age=604800";
            }
        }
    }
    
    # Backend API - proxy to Node.js server
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Increase timeout for long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Health check endpoints
    location /health {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /ping {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # WebSocket support for ConversationRelay with Media Streaming Optimizations
    location /api/conversationrelay-ws {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Media Streaming Optimizations
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;

        # WebSocket specific timeouts for media streaming
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        # Buffer sizes for audio streaming
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;

        # Keep-alive for persistent connections
        proxy_set_header Connection "keep-alive";
        proxy_http_version 1.1;
    }

    # Media streaming endpoints
    location /api/media/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Media streaming optimizations
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;

        # Larger buffer for media content
        client_max_body_size 50M;
        proxy_max_temp_file_size 0;

        # Timeouts for media processing
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
}
